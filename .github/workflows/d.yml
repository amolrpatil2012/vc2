name: "Dependency Review (SCA)"
 
on:
  
    
  workflow_dispatch:
 
permissions:
  contents: read
  pull-requests: write   # lets the action post a summary comment
 
jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high          # fail the PR on high/critical vulns
          comment-summary-in-pr: always
 
